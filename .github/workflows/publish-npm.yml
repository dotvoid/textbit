name: Publish to npm

# The file keeps its name: npm's trusted publisher configuration for each
# package points at it.
on:
  push:
    tags:
      # @dotvoid/textbit
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      # @dotvoid/textbit-plugins and @dotvoid/textbit-styles
      - 'textbit-plugins@[0-9]+.[0-9]+.[0-9]+*'
      - 'textbit-styles@[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  build:
    name: Build and publish npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'

      - name: Upgrade npm (pin to npm 11 for stable OIDC; avoid tracking npm@latest)
        run: npm install -g npm@^11
      - name: Install dependencies
        run: npm ci
      - name: Find the package for this tag
        id: package
        run: |
          case "$GITHUB_REF_NAME" in
            textbit-plugins@*) echo "dir=packages/plugins" >> "$GITHUB_OUTPUT" ;;
            textbit-styles@*)  echo "dir=packages/styles" >> "$GITHUB_OUTPUT" ;;
            *)                 echo "dir=packages/textbit" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME##*@}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in $(pwd)/package.json"
            exit 1
          fi
      - name: Build package
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm run build --if-present
      - name: Publish package
        working-directory: ${{ steps.package.outputs.dir }}
        env:
          # Only for the first publish of a new package, before npm lets it have
          # a trusted publisher. Set the NPM_TOKEN secret for that one run and
          # delete it afterwards; trusted publishing (OIDC) needs no token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
