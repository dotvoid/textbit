name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  build:
    name: Build and publish npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'

      - name: Upgrade npm (pin to npm 11 for stable OIDC; avoid tracking npm@latest)
        run: npm install -g npm@^11
      - name: Install dependencies
        run: npm ci
      # v* tags release the editor package. The file keeps its name: npm's
      # trusted publisher configuration for @dotvoid/textbit points at it.
      - name: Build package
        working-directory: packages/textbit
        run: npm run build
      - name: Publish package
        working-directory: packages/textbit
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
